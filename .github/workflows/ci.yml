name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Parser Parity Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm install playwright-core

      - name: Run Python Parser Tests
        run: python tests/parity.py > py.json

      - name: Run JS Worker Tests
        run: node tests/parity.js > js.json

      - name: Compare Parsers (Parity Check)
        run: python tests/parity_check.py py.json js.json
